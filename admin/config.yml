# OPPIA ROBOTICS yönetim paneli (Decap CMS) ayarları
# Panel: https://www.oppiarobotics.com/admin
# Girişler GitHub hesabıyla yapılır; yalnızca repoya yazma yetkisi olanlar kaydedebilir.

backend:
  name: github
  repo: amuckaahmet1-jpg/oppia-robotics-site
  branch: main
  # "[skip netlify]" etiketi sayesinde panel kayıtları Netlify'da otomatik yayın başlatmaz
  # (her yayın kredi harcar). Değişiklikleri siteye yansıtmak için Netlify'da
  # Deploys → Trigger deploy → Deploy project ile elle yayınlayın.
  commit_messages:
    create: "{{collection}}: {{slug}} oluşturuldu [skip netlify]"
    update: "{{collection}}: {{slug}} güncellendi [skip netlify]"
    delete: "{{collection}}: {{slug}} silindi [skip netlify]"
    uploadMedia: "Fotoğraf yüklendi: {{path}} [skip netlify]"
    deleteMedia: "Fotoğraf silindi: {{path}} [skip netlify]"

locale: tr

# Panelden yüklenen fotoğraflar buraya kaydedilir
media_folder: images/uploads
public_folder: images/uploads

collections:
  - name: icerik
    label: Site İçeriği
    description: "Kaydettiğiniz değişiklikler siteye hemen yansımaz. İşiniz bitince sağ alttaki \"Siteyi Yayınla\" butonuyla Netlify'dan tek seferde yayınlayın."
    files:
      - name: site
        label: Genel Bilgiler (Hero, Hakkımızda, Tarihçe, İletişim)
        file: content/site.json
        fields:
          - label: Hero (sayfanın en üstü)
            name: hero
            widget: object
            fields:
              - { label: Üst etiket, name: badge, widget: string, hint: "Örn. Sistem Aktif — 2026 Sezonu" }
              - { label: Slogan, name: tagline, widget: string }
              - { label: Tanıtım yazısı, name: intro, widget: text }
          - label: Hakkımızda
            name: about
            widget: object
            fields:
              - { label: Başlık, name: heading, widget: string }
              - { label: Metin, name: text, widget: text }
              - { label: Misyonumuz, name: mission, widget: text }
              - { label: Vizyonumuz, name: vision, widget: text }
          - label: Tarihçe
            name: history
            widget: object
            fields:
              - { label: Başlık, name: heading, widget: string }
              - { label: Alıntı paneli metni, name: quote, widget: text }
              - label: Zaman çizelgesi
                name: events
                widget: list
                label_singular: Olay
                summary: "{{fields.date}} — {{fields.title}}"
                fields:
                  - { label: Tarih, name: date, widget: string, hint: "Örn. Nisan 2017" }
                  - { label: Başlık, name: title, widget: string }
                  - { label: Açıklama, name: text, widget: text, required: false }
          - label: İletişim
            name: contact
            widget: object
            fields:
              - { label: Bölüm açıklaması, name: intro, widget: text }
              - { label: E-posta (gösterilen), name: email, widget: string, hint: "Sadece sayfada görünen adres. İletişim formunun gittiği adres ayrıca ayarlanır." }
              - { label: Adres, name: address, widget: string }
              - label: Sosyal medya hesapları
                name: socials
                widget: list
                label_singular: Hesap
                summary: "{{fields.platform}} — {{fields.url}}"
                fields:
                  - label: Platform
                    name: platform
                    widget: select
                    options:
                      - { label: Instagram, value: instagram }
                      - { label: YouTube, value: youtube }
                      - { label: LinkedIn, value: linkedin }
                      - { label: X (Twitter), value: x }
                      - { label: GitHub, value: github }
                      - { label: Web sitesi, value: website }
                  - { label: Bağlantı, name: url, widget: string, pattern: ['^https?://', "Bağlantı https:// ile başlamalı"] }

      - name: team
        label: Takım Üyeleri
        file: content/team.json
        fields:
          - label: Üyeler
            name: members
            widget: list
            label_singular: Üye
            summary: "{{fields.name}} — {{fields.role}}"
            fields:
              - { label: Ad Soyad, name: name, widget: string }
              - { label: Görev, name: role, widget: string, required: false, hint: "Örn. Takım Kaptanı, Yazılım Sorumlusu" }
              - { label: Üst satırda göster, name: featured, widget: boolean, default: false, required: false, hint: "Açık olanlar (kaptan, danışman vb.) diğer üyelerin üstünde gösterilir" }
              - { label: Fotoğraf, name: photo, widget: image, required: false, hint: "Kare, yüz ortada bir fotoğraf en iyi sonucu verir. Boş bırakılırsa baş harfler gösterilir." }
              - label: Eğitim
                name: education
                widget: list
                label_singular: Eğitim bilgisi
                required: false
                summary: "{{fields.department}} — {{fields.school}}"
                fields:
                  - { label: Bölüm, name: department, widget: string, required: false }
                  - { label: Okul, name: school, widget: string, required: false }

      - name: robots
        label: Robotlarımız
        file: content/robots.json
        fields:
          - label: Robotlar
            name: robots
            widget: list
            label_singular: Robot
            summary: '{{fields.code}} "{{fields.name}}"'
            fields:
              - { label: Kod, name: code, widget: string, hint: "Örn. OPPIA-VIII" }
              - { label: Robot adı, name: name, widget: string, required: false, hint: "Örn. SEAWOLF" }
              - { label: Yarışma, name: competition, widget: string, required: false }
              - { label: Sonuç, name: result, widget: string, required: false, hint: "Örn. 2026 — Finalist" }
              - { label: Fotoğraf, name: image, widget: image, required: false }
              - { label: Fotoğraf açıklaması (alt metin), name: alt, widget: string, required: false }
              - { label: Açıklama, name: description, widget: text, required: false }
              - label: Özellikler
                name: features
                widget: list
                required: false
                field: { label: Özellik, name: feature, widget: string }

      - name: stats
        label: Sayaçlar (Rakamlarla OPPIA)
        file: content/stats.json
        fields:
          - label: Sayaçlar
            name: stats
            widget: list
            label_singular: Sayaç
            max: 4
            summary: "{{fields.value}} — {{fields.label}}"
            fields:
              - { label: Sayı, name: value, widget: number, value_type: int, min: 0 }
              - { label: Başlık, name: label, widget: string }

      - name: awards
        label: Ödüller & Dereceler
        file: content/awards.json
        fields:
          - label: Ödüller
            name: awards
            widget: list
            label_singular: Ödül
            summary: "{{fields.title}} — {{fields.result}}"
            fields:
              - { label: Yarışma, name: title, widget: string }
              - { label: Derece, name: result, widget: string, required: false }

      - name: gallery
        label: Arenadan Kareler (Galeri)
        file: content/gallery.json
        fields:
          - label: Kareler
            name: slides
            widget: list
            label_singular: Kare
            summary: "{{fields.title}}"
            fields:
              - { label: Başlık, name: title, widget: string }
              - { label: Alt yazı, name: caption, widget: string, required: false }
              - { label: Fotoğraf, name: image, widget: image }
              - { label: Fotoğraf açıklaması (alt metin), name: alt, widget: string, required: false }
